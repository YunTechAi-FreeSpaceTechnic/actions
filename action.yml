name: "Build and Push Docker Image to GHCR"
description: "Builds a Docker image and pushes it to GitHub Container Registry."
inputs:
  image_name:
    description: "Base name of the Docker image in GHCR (e.g., my-app)"
    required: false
  extra_tags:
    description: "Additional tags to apply (comma-separated)"
    required: false
    default: ""
  token:
    description: "GitHub Token"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Clone ModelServer Repository
      run: git clone --recurse-submodules https://github.com/YunTechAi-FreeSpaceTechnic/ModelServer.git
      shell: bash

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: ModelServer/model

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.token }} # Using github.token in a reusable action

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set a variable
      run: |
        IMAGE_NAME="${{ inputs.image_name }}"
        if [ -z "$IMAGE_NAME" ]; then
          IMAGE_NAME="$(basename "${{ github.repository }}")"
        fi
        IMAGE_FULL_NAME="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"

        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ModelServer
        push: true
        build-args: MODEL=model
        tags: ${IMAGE_FULL_NAME,,}:latest,${IMAGE_FULL_NAME,,}:${{ inputs.extra_tags }}

